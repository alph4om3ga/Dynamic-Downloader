name: Windows queue regression

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  queue-regression:
    name: QueueManager cleanup/completion regression
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore regression project
        run: dotnet restore JudasEncodingManager/RegressionTests/JudasEncodingManager.RegressionTests.csproj

      - name: Run Windows queue regression
        run: dotnet run --project JudasEncodingManager/RegressionTests/JudasEncodingManager.RegressionTests.csproj --framework net8.0-windows --no-restore

